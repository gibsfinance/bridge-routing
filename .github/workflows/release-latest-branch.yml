name: Release Latest

on:
  push:
    branches:
      - staging
      - master

jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable

      - name: Set Yarn version
        run: corepack prepare yarn@4.10.3 --activate
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          cache: yarn
          node-version: '22.12.x'
        env:
          YARN_VERSION: 4.10.3
      - name: Install dependencies
        run: yarn
        env:
          NPM_TOKEN: '${{ secrets.NPM_TOKEN }}'
      - name: Build project
        run: yarn run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          PUBLIC_NODE_ENV: 'production'
          PUBLIC_IMAGE_ROOT: 'https://gib.show'
          PUBLIC_PROJECT_ID: '1f8a963aa1809cada8560d560360107d'
          NODE_ENV: 'production'
          NPM_TOKEN: '${{ secrets.NPM_TOKEN }}'
      - name: Copy info
        run: cp packages/ui/package.json packages/ui/dist/version.json
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 'ui-dist-${{github.sha}}'
          overwrite: true
          path: packages/ui/dist/
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 'abis-dist-${{github.sha}}'
          overwrite: true
          path: packages/abis/dist/
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 'bridge-sdk-dist-${{github.sha}}'
          overwrite: true
          path: packages/bridge-sdk/dist/
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 'common-dist-${{github.sha}}'
          overwrite: true
          path: packages/common/dist/
  release-pinata:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable

      - name: Set Yarn version
        run: corepack prepare yarn@4.10.3 --activate
      - uses: actions/setup-node@v5
        with:
          cache: yarn
          node-version: '22.12.x'
        env:
          YARN_VERSION: 4.10.3
      - run: yarn
        env:
          NPM_TOKEN: '${{ secrets.NPM_TOKEN }}'
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: 'ui-dist-${{github.sha}}'
          path: packages/ui/dist/
      - name: Upload build to Pinata
        run: npm run pinata:publish
        env:
          NODE_ENV: 'production'
          PINATA_API_KEY: '${{ secrets.PINATA_API_KEY }}'
  publish-github:
    permissions: write-all
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable

      - name: Set Yarn version
        run: corepack prepare yarn@4.10.3 --activate
      - uses: actions/setup-node@v5
        with:
          cache: yarn
          node-version: '22.12.x'
        env:
          YARN_VERSION: 4.10.3
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: 'ui-dist-${{github.sha}}'
          path: packages/ui/dist/
      - name: Read version from package.json
        id: get_version
        run: echo "VERSION=$(node -p 'require(`./packages/ui/package.json`).version')" >> $GITHUB_ENV
      - name: Create tag
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git tag -a v$VERSION -m "Release v$VERSION" || echo "Tag v$VERSION already exists, skipping"
          git push origin v$VERSION || echo "Tag v$VERSION already pushed, skipping"
  publish-npm:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22.12.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: 'abis-dist-${{github.sha}}'
          path: packages/abis/dist/
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: 'common-dist-${{github.sha}}'
          path: packages/common/dist/
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: 'bridge-sdk-dist-${{github.sha}}'
          path: packages/bridge-sdk/dist/
      - name: Publish @gibs/abis
        run: npm publish --provenance --access public
        working-directory: packages/abis
      - name: Publish @gibs/common
        run: npm publish --provenance --access public
        working-directory: packages/common
      - name: Publish @gibs/bridge-sdk
        run: npm publish --provenance --access public
        working-directory: packages/bridge-sdk
